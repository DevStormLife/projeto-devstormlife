<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StormLife</title>
    <link rel="stylesheet" href="/Frontend/style/style.css">
</head>
<body>
    
    <header>
        <a href="/Frontend/pages/homePage.html" class="btnVoltar">
        <img class="logo" src="/img/logoimg.png" alt="logo"></a>
        <h1 class="titulo">Storm Life <br><p class="sub">Security Access</p></h1>
    
    </header>
    <footer>
        <h2>© 2026 DevStormLife</h2>
    </footer>
    <main class="login-area">
    <div class="login-card">
        <div class="login-header">
            <h2>LOGIN</h2>
        </div>
        
        <!-- Adicionado id="form-login" -->
        <form id="form-login" class="login-form">
            <!-- Adicionado id="login" -->
            <input type="text" id="login" class="login-input" placeholder="CPF/EMAIL:" required>
            <!-- Adicionado id="senha" -->
            <input type="password" id="senha" class="login-input" placeholder="SENHA:" required>
            
            <!-- Adicionado espaço para mensagem de erro com estilo discreto para não quebrar o layout -->
            <div id="mensagem-erro" style="color: #ff4d4d; text-align: center; font-size: 0.9rem; font-weight: bold;"></div>
            
            <button type="submit" class="btn-entrar">ENTRAR</button>
            <p class="link-cadastro">Não tem uma conta? <a href="/Frontend/pages/homePage.html" class="linkc">Cadastre-se</a></p>
            
        </form>
    </div>
    
</main>

<!-- Lembre-se de ajustar o caminho do src para onde está o seu arquivo JS -->
<script src="/script/login.js"></script>
</body>
</html>
