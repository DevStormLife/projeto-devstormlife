<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Separado</title>
    <link rel="stylesheet" href="../style/cadastro.css">
</head>
<body>
    
    <header>
        <img class="logo" src="../img/logoimg.png" alt="logo">
        <h1 class="titulo">Storm Life <br><p class="sub">Security Access</p></h1>
    </header>
    
    <footer>
        <h2>© 2026 DevStormLife</h2>
    </footer>
    <main class="cadastro-area">
    <div class="cadastro-card">
        <div class="cadastro-header">
            <h2>CADASTRO</h2>
        </div>
        
        <form class="cadastro-form">
            <input type="text" class="cadastro-input" placeholder="NOME:">
            <input type="text" class="cadastro-input" placeholder="CPF:">
            <input type="email" class="cadastro-input" placeholder="EMAIL:">
            <input type="password" class="cadastro-input" placeholder="SENHA:">
            
            <a href="../index.html">
            <button type="submit" class="btn-entrar" id="btn-entrar">ENTRAR</button>
            </a>
        </form>
    </div>
    <script src="../script/cadastro.js"></script>
</main>
</body>
</html>
