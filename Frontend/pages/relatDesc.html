<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StormLife - Relatório Descritivo</title>
    <link rel="stylesheet" href="../style/relatDesc.css">
</head>

<body>

<header>
    <img class="logo" src="../img/logoimg.png" alt="logo">
    <div>
        <h1 class="titulo">Storm Life</h1>
        <p class="sub">Security Access</p>
    </div>
</header>

<main class="container">

    <div class="card">

        <div class="card-header">
            <h2>RELATÓRIO DESCRITIVO</h2>
            <span class="filtros">Filtros</span>
        </div>

        <table class="tabela">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>RF</th>
                    <th>Data/Hora</th>
                    <th>Local</th>
                    <th>Cód.Subestação</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>xxx</td>
                    <td>xx</td>
                    <td>xxx</td>
                    <td>xxx</td>
                    <td>xx</td>
                </tr>
            </tbody>
        </table>

        <div class="descricao">
            <p>DESCRIÇÃO:</p>

            <div class="linhas"></div>
            <div class="linhas"></div>
            <div class="linhas"></div>
            <div class="linhas"></div>
            <div class="linhas"></div>
            <div class="linhas"></div>
            <div class="linhas"></div>
            <div class="linhas"></div>
            <div class="linhas"></div>
            <div class="linhas"></div>
            <div class="linhas"></div>
            <div class="linhas"></div>
        </div>

    </div>

</main>

<dialog id="modalAdicionar" class="modal">
    <div class="modal-content">
        <h3>Adicionar Novo Registro</h3>
        <form id="formAdicionar">
            <div class="form-group">
                <label for="modalNome">Nome:</label>
                <input type="text" id="modalNome" required placeholder="Digite o nome">
            </div>
            <div class="form-group">
                <label for="modalRf">RF:</label>
                <input type="text" id="modalRf" placeholder="Digite o RF">
            </div>
            <div class="form-group">
                <label for="modalDataHora">Data/Hora:</label>
                <input type="text" id="modalDataHora" placeholder="Ex: 12/06/2026 15:30">
            </div>
            <div class="form-group">
                <label for="modalLocal">Local:</label>
                <input type="text" id="modalLocal" placeholder="Digite o local">
            </div>
            <div class="form-group">
                <label for="modalCodSubestacao">Cód. Subestação:</label>
                <input type="text" id="modalCodSubestacao" placeholder="Digite o código">
            </div>
            <div class="modal-actions">
                <button type="button" id="btnCancelarModal" class="btn-cancelar">Cancelar</button>
                <button type="submit" class="btn-salvar">Salvar</button>
            </div>
        </form>
    </div>
</dialog>

<footer>
    © 2026 DevStormLife
</footer>
<script src="../script/relatDesc.js"></script>

</body>
</html>
