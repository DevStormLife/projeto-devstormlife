spring.application.name=dev-stormlife

spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQLDialect
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update

spring.sql.init.mode = never
spring.jpa.open-in-view=false
stormlife.frontend.origin=${STORMLIFE_FRONTEND_ORIGIN:http://localhost:5500}
stormlife.bootstrap.email=${STORMLIFE_BOOTSTRAP_EMAIL:}
stormlife.bootstrap.password=${STORMLIFE_BOOTSTRAP_PASSWORD:}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
